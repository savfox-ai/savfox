[package]
name = "savfox-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true

[lib]
name = "savfox_channels"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["discord", "telegram", "dingtalk", "feishu"]
# Streaming/polling SDK adapters per platform. Disable to skip the heavy
# upstream SDK and the corresponding `<platform>` module.
discord = ["dep:serenity"]
telegram = ["dep:teloxide"]
dingtalk = ["dep:dingtalk-sdk"]
feishu = ["dep:feishu-sdk"]
arkret = [
    "dep:arkret",
    "dep:arkret-schema",
    "dep:arkret-crypto",
    "dep:arkret-models-collaboration",
    "dep:arkret-signatures",
    "dep:arkret-wire",
    "dep:garth",
    "dep:savfox-keyring-store",
    "dep:rand",
    "dep:chacha20poly1305",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dingtalk-sdk = { workspace = true, optional = true }
feishu-sdk = { workspace = true, optional = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
parking_lot = { workspace = true }
rand = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
hmac = { workspace = true }
reqwest = { workspace = true }
savfox-core = { workspace = true }
savfox-keyring-store = { workspace = true, optional = true }
savfox-utils = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
serenity = { workspace = true, optional = true }
sha2 = { workspace = true }
subtle = { workspace = true }
teloxide = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
arkret = { workspace = true, optional = true }
arkret-schema = { workspace = true, optional = true }
arkret-crypto = { workspace = true, optional = true }
arkret-models-collaboration = { workspace = true, optional = true }
arkret-signatures = { workspace = true, optional = true }
arkret-wire = { workspace = true, optional = true }
garth = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
