[package]
name = "savfox-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true

[lib]
name = "savfox_channels"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["discord", "telegram", "dingtalk", "feishu", "cokret"]
# Streaming/polling SDK adapters per platform. Disable to skip the heavy
# upstream SDK and the corresponding `<platform>` module.
discord = ["dep:serenity"]
telegram = ["dep:teloxide"]
dingtalk = ["dep:dingtalk-sdk"]
feishu = ["dep:feishu-sdk"]
cokret = ["dep:cokret-http-client", "dep:cokret-core", "dep:cokret-identifiers", "dep:cokret", "dep:cokret-bridge-runtime", "dep:parking_lot"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cokret-http-client = { git = "https://github.com/cokret/cokret-rust-sdk.git", rev = "5bdb3fe0f88139c241b171b87b86f091fe46d4cb", package = "cokret-http-client", optional = true, default-features = false }
cokret-core = { git = "https://github.com/cokret/cokret-rust-sdk.git", rev = "5bdb3fe0f88139c241b171b87b86f091fe46d4cb", package = "cokret-core", optional = true, default-features = false, features = ["client"] }
cokret-identifiers = { git = "https://github.com/cokret/cokret-rust-sdk.git", rev = "5bdb3fe0f88139c241b171b87b86f091fe46d4cb", package = "cokret-identifiers", optional = true, default-features = false }
cokret = { git = "https://github.com/cokret/cokret-rust-sdk.git", rev = "5bdb3fe0f88139c241b171b87b86f091fe46d4cb", package = "cokret", optional = true, default-features = false, features = ["client", "applet-runtime", "device-runtime", "full-surface", "mls", "signer"] }
cokret-bridge-runtime = { git = "https://github.com/cokret/bridges.git", rev = "fce5a9150518c8f94414ec7d52d505ef727fe685", package = "cokret-bridge-runtime", optional = true, default-features = false, features = ["edge"] }
dingtalk-sdk = { workspace = true, optional = true }
feishu-sdk = { workspace = true, optional = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
parking_lot = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
hmac = { workspace = true }
reqwest = { workspace = true }
savfox-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
serenity = { workspace = true, optional = true }
sha2 = { workspace = true }
subtle = { workspace = true }
teloxide = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
bytes = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
