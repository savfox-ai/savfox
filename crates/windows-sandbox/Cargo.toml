[package]
build = "build.rs"
edition = "2021"
license.workspace = true
name = "savfox-windows-sandbox"
version.workspace = true

[lib]
name = "savfox_windows_sandbox"
path = "src/lib.rs"

[[bin]]
name = "savfox-windows-sandbox-setup"
path = "src/bin/setup_main.rs"

[[bin]]
name = "savfox-command-runner"
path = "src/bin/command_runner.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
dirs-next = { workspace = true }
dunce = { workspace = true }
savfox-protocol = { workspace = true }
savfox-utils-absolute-path = { workspace = true }
savfox-utils-string = { workspace = true }
rand = { workspace = true, features = ["std", "small_rng", "os_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
winres = { workspace = true }
