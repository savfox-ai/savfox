[workspace]
members = [
    "crates/*",
    "crates/utils/absolute-path",
    "crates/utils/cache",
    "crates/utils/cargo-bin",
    "crates/utils/git",
    "crates/utils/home-dir",
    "crates/utils/image",
    "crates/utils/json-to-toml",
    "crates/utils/pty",
    "crates/utils/readiness",
    "crates/utils/string",
    "crates/app-server/tests/common",
    "crates/core/tests/common",
    "crates/exec-server/tests/common",
    "crates/mcp-server/tests/common",
]
exclude = ["crates/docs", "crates/scripts", "crates/utils"]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["Chrislearn Young <chris@acroidea.com>"]
edition = "2024"
rust-version = "1.93"
description = """
Experimental AI API client library for Rust.
"""
homepage = "https://github.com/savfox-ai/savfox"
repository = "https://github.com/savfox-ai/savfox"
documentation = "https://docs.rs/savfox/"
readme = "./README.md"
categories = ["api-bindings", "web-programming", "asynchronous"]
keywords = ["openai", "async", "openapi", "ai"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
savfox = { version = "0.3.0", path = "crates/savfox", default-features = true }
savfox-app-server-protocol = { version = "0.3.0", path = "crates/app-server-protocol", default-features = true }
