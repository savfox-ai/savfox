[workspace]
members = [
    "crates/*",
    "crates/utils",
    "crates/app-server/tests/common",
    "crates/core/tests/common",
    "crates/exec-server/tests/common",
    "crates/mcp-server/tests/common",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
authors = ["Chrislearn Young <chris@sonc.ai>"]
edition = "2024"
rust-version = "1.94"
description = """
Experimental AI API client library for Rust.
"""
homepage = "https://github.com/savfox-ai/savfox"
repository = "https://github.com/savfox-ai/savfox"
documentation = "https://docs.rs/savfox/"
readme = "./README.md"
categories = ["api-bindings", "web-programming", "asynchronous"]
keywords = ["openai", "async", "openapi", "ai"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
savfox = { version = "0.3.0", path = "crates/savfox", default-features = true }
