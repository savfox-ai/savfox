[workspace.lints.rust]
missing_debug_implementations = "warn"
# missing_docs = "warn"
unreachable_pub = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
await_holding_lock = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
future_not_send = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_match_else = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
type_complexity = "allow"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

# ── Patch crates-io ─────────────────────────────────────────────────────────
# Ensure transitive dependencies (e.g. tracing-opentelemetry) use the same
# git revision of the opentelemetry crates as our workspace.
[patch.crates-io]
opentelemetry = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }
opentelemetry_sdk = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }
opentelemetry-http = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }
opentelemetry-otlp = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }
opentelemetry-appender-tracing = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }
opentelemetry-semantic-conventions = { git = "https://github.com/open-telemetry/opentelemetry-rust.git", branch = "main" }

# ── Build profiles ──────────────────────────────────────────────────────────

# Speed up debug builds: optimize dependencies but not workspace crates
[profile.dev.package."*"]
opt-level = 1

# Faster debug builds: fewer codegen units = faster linking
[profile.dev]
debug = "line-tables-only"
