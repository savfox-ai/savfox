# Windows MSVC targets use Rust's default linker from Visual Studio Build Tools.
# No standalone LLVM installation is required for linking.

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Uncomment locally if you have LLVM lld installed via Homebrew:
# [target.'cfg(target_os = "macos")']
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
