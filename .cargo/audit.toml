[advisories]
# Only existing informational maintenance notices are accepted here. Do not
# suppress security vulnerabilities: the upgraded lockfile has no outstanding
# RustSec vulnerabilities when audited without this configuration.
ignore = [
    # Starlark 0.13 / starlark_map still use fxhash 0.2.1. The Starlark 0.14
    # upgrade is blocked by its blake3 pin conflicting with the Arkret SDK.
    "RUSTSEC-2025-0057",
    # Starlark 0.13 still uses paste 1.0.15; this is a build-time macro notice.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 2.0.1 is retained through aquamarine -> teloxide and
    # hax-lib-macros -> hax-lib. Both are upstream build-time macro paths.
    "RUSTSEC-2026-0173",
    # Starlark 0.13 / starlark_syntax still use derivative 2.2.0 (proc macro).
    "RUSTSEC-2024-0388",
]
