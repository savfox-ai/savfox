name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFMT_NIGHTLY: nightly

jobs:
  # ─── Detect change scope ───────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      core: ${{ steps.filter.outputs.core }}
      protocol: ${{ steps.filter.outputs.protocol }}
      tui: ${{ steps.filter.outputs.tui }}
      gateway: ${{ steps.filter.outputs.gateway }}
      channels: ${{ steps.filter.outputs.channels }}
      docs: ${{ steps.filter.outputs.docs }}
      docker: ${{ steps.filter.outputs.docker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            core:
              - 'crates/core/**'
              - 'crates/config/**'
              - 'crates/model/**'
              - 'crates/http-client/**'
              - 'crates/api-client/**'
              - 'crates/common/**'
            protocol:
              - 'crates/protocol/**'
              - 'crates/app-server/**'
              - 'crates/app-server-protocol/**'
              - 'crates/mcp-server/**'
            tui:
              - 'crates/tui/**'
              - 'crates/ansi-escape/**'
            gateway:
              - 'crates/gateway-server/**'
              - 'crates/gateway-shared/**'
              - 'scripts/build-web.ps1'
            channels:
              - 'crates/channels/**'
            docs:
              - 'docs/**'
              - '*.md'
            docker:
              - 'Dockerfile*'
              - 'compose.yml'
            web:
              - 'crates/gateway-dioxus/**'

  # ─── Formatting ────────────────────────────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: rustfmt-toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_NIGHTLY }}
          components: rustfmt
      - run: cargo +${{ steps.rustfmt-toolchain.outputs.name }} fmt --all --check

  # ─── Clippy lints ──────────────────────────────────────────────────
  clippy:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  # ─── Tests ─────────────────────────────────────────────────────────
  test:
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace
        env:
          RUST_LOG: debug

  # ─── Targeted domain tests ────────────────────────────────────────
  test-targeted:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core matrix
        if: needs.changes.outputs.core == 'true' || github.ref == 'refs/heads/main'
        run: cargo test -p savfox-core -p savfox-config -p savfox-model -p savfox-http-client -p savfox-api-client
      - name: Protocol matrix
        if: needs.changes.outputs.protocol == 'true' || github.ref == 'refs/heads/main'
        run: cargo test -p savfox-protocol -p savfox-app-server-protocol -p savfox-app-server -p savfox-mcp-server
      - name: TUI matrix
        if: needs.changes.outputs.tui == 'true' || github.ref == 'refs/heads/main'
        run: cargo test -p savfox-tui
      - name: Gateway and channel matrix
        if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.channels == 'true' || needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
        run: cargo test -p savfox-gateway-server -p savfox-gateway-shared -p savfox-channels

  # ─── Code coverage ─────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Check gateway-server coverage threshold
        run: |
          SUMMARY=$(cargo llvm-cov -p savfox-gateway-server --summary-only 2>/dev/null || true)
          echo "$SUMMARY"
          COVERAGE=$(echo "$SUMMARY" | awk '/TOTAL/ {gsub("%","",$NF); print $NF}' | tail -n1)
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse coverage for savfox-gateway-server"
            exit 1
          fi
          echo "savfox-gateway-server coverage: ${COVERAGE}%"
          python - <<PY
          import sys
          coverage = float("${COVERAGE}")
          threshold = 70.0
          if coverage < threshold:
              print(f"::error::Coverage {coverage:.2f}% is below {threshold:.2f}% threshold")
              sys.exit(1)
          print(f"Coverage check passed: {coverage:.2f}% >= {threshold:.2f}%")
          PY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ─── Dependency audit ──────────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run advisory audit
        run: cargo audit

  # ─── License compliance report ────────────────────────────────────
  licenses:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-license
        run: cargo install cargo-license --locked
      - name: Generate dependency license report
        run: cargo license --avoid-build-deps --json > licenses.json
      - name: Ensure license report is non-empty
        run: test -s licenses.json

  # ─── Build release binary ──────────────────────────────────────────
  build:
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, test, coverage, audit, licenses]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: savfox
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: savfox
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: savfox.exe
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --bin savfox --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: savfox-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  # ─── Web UI build ─────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gateway-dioxus
          key: web-wasm
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked
      - name: Build Web UI
        working-directory: crates/gateway-dioxus
        run: dx build --release

  # ─── Docker build (linux only) ─────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: savfox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
