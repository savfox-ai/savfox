name: Publish crates

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve publishable crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build publish matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )

          workspace_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          workspace_members = set(metadata["workspace_members"])
          workspace_packages = [
              pkg for pkg in metadata["packages"] if pkg["id"] in workspace_members
          ]
          by_name = {pkg["name"]: pkg for pkg in workspace_packages}

          candidates = {}
          skipped = {}

          for pkg in workspace_packages:
              name = pkg["name"]
              manifest_path = pathlib.Path(pkg["manifest_path"])
              manifest_str = manifest_path.as_posix()

              if pkg.get("publish") == []:
                  skipped[name] = "publish=false"
                  continue

              if "/tests/common/" in manifest_str:
                  skipped[name] = "test-support workspace crate"
                  continue

              if name == "savfox-gateway-dioxus":
                  skipped[name] = "web-ui package (not published to crates.io)"
                  continue

              candidates[name] = pkg

          def internal_runtime_deps(package):
              deps = []
              for dep in package.get("dependencies", []):
                  kind = dep.get("kind")
                  if kind in (None, "normal", "build"):
                      dep_name = dep["name"]
                      if dep_name in by_name:
                          deps.append(dep_name)
              return deps

          changed = True
          while changed:
              changed = False
              for crate in list(candidates.keys()):
                  deps = internal_runtime_deps(candidates[crate])
                  blocked_deps = sorted({dep for dep in deps if dep not in candidates})
                  if blocked_deps:
                      skipped[crate] = (
                          "depends on non-publishable internal crate(s): "
                          + ", ".join(blocked_deps)
                      )
                      del candidates[crate]
                      changed = True

          indegree = {name: 0 for name in candidates}
          dependents = {name: [] for name in candidates}
          for name, pkg in candidates.items():
              for dep in internal_runtime_deps(pkg):
                  if dep in candidates:
                      indegree[name] += 1
                      dependents[dep].append(name)

          queue = sorted([name for name, count in indegree.items() if count == 0])
          order = []
          while queue:
              current = queue.pop(0)
              order.append(current)
              for dependent in sorted(dependents[current]):
                  indegree[dependent] -= 1
                  if indegree[dependent] == 0:
                      queue.append(dependent)
              queue.sort()

          if len(order) != len(candidates):
              print("Failed to determine publish order due to a dependency cycle.", file=sys.stderr)
              sys.exit(1)

          matrix = {"package": []}
          for name in order:
              pkg = candidates[name]
              manifest_path = pathlib.Path(pkg["manifest_path"]).resolve()
              package_dir = manifest_path.parent.relative_to(workspace_root).as_posix()
              matrix["package"].append({"crate": name, "path": package_dir})

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"count={len(matrix['package'])}\n")

          print(f"Resolved {len(matrix['package'])} crates for publishing.")
          if skipped:
              print("Skipped crates:")
              for name in sorted(skipped):
                  print(f"- {name}: {skipped[name]}")
          PY

  publish:
    name: Publish ${{ matrix.package.crate }}
    needs: [resolve]
    if: needs.resolve.outputs.count != '0' && secrets.CRATES_TOKEN != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get releasing version
        shell: bash
        run: |
          NEXT_VERSION="$(cargo pkgid --manifest-path "${{ matrix.package.path }}/Cargo.toml" | sed -nE 's/.*@([^ ]+)/\1/p')"
          if [ -z "${NEXT_VERSION}" ]; then
            echo "::error::Failed to determine local version for ${{ matrix.package.crate }}"
            exit 1
          fi
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Check published version
        shell: bash
        run: |
          PREV_VERSION="$(
            curl -fsSL "https://crates.io/api/v1/crates/${{ matrix.package.crate }}" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('crate', {}).get('max_stable_version', ''))" \
              2>/dev/null \
              || true
          )"
          echo "PREV_VERSION=${PREV_VERSION}" >> "$GITHUB_ENV"

      - name: Cargo login
        if: env.NEXT_VERSION != env.PREV_VERSION
        run: cargo login "${{ secrets.CRATES_TOKEN }}"

      - name: Cargo package
        if: env.NEXT_VERSION != env.PREV_VERSION
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          echo "Releasing version: ${NEXT_VERSION}"
          echo "Published version: ${PREV_VERSION:-<none>}"
          cargo package

      - name: Publish crate
        if: env.NEXT_VERSION != env.PREV_VERSION
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          echo "Cargo publishing..."
          cargo publish --no-verify
          echo "Published ${NEXT_VERSION}"

      - name: Skip already published crate
        if: env.NEXT_VERSION == env.PREV_VERSION
        run: echo "${{ matrix.package.crate }} ${NEXT_VERSION} already exists on crates.io, skipping."
