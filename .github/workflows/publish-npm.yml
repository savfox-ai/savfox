name: Publish NPM Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the checked-out commit (e.g., 0.3.1 or v0.3.1)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-release-web

  build-linux:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ui-sources

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: actions/download-artifact@v8
        with:
          name: gateway-release-web
          path: crates/gateway-server/static
      - run: node scripts/verify-web-bundle.cjs

      - name: Build Linux x64
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p savfox-cli

      - name: Build Linux ARM64
        run: cargo build --locked --release --target aarch64-unknown-linux-musl -p savfox-cli

      - name: Package Linux binaries
        run: |
          mkdir -p dist/x86_64-unknown-linux-musl/savfox
          mkdir -p dist/aarch64-unknown-linux-musl/savfox
          cp target/x86_64-unknown-linux-musl/release/savfox dist/x86_64-unknown-linux-musl/savfox/
          cp target/aarch64-unknown-linux-musl/release/savfox dist/aarch64-unknown-linux-musl/savfox/
          chmod +x dist/*/savfox/savfox

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: dist/

  build-macos:
    needs: [web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ui-sources

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: actions/download-artifact@v8
        with:
          name: gateway-release-web
          path: crates/gateway-server/static
      - run: node scripts/verify-web-bundle.cjs

      - name: Build macOS x64
        run: cargo build --locked --release --target x86_64-apple-darwin -p savfox-cli

      - name: Build macOS ARM64
        run: cargo build --locked --release --target aarch64-apple-darwin -p savfox-cli

      - name: Package macOS binaries
        run: |
          mkdir -p dist/x86_64-apple-darwin/savfox
          mkdir -p dist/aarch64-apple-darwin/savfox
          cp target/x86_64-apple-darwin/release/savfox dist/x86_64-apple-darwin/savfox/
          cp target/aarch64-apple-darwin/release/savfox dist/aarch64-apple-darwin/savfox/
          chmod +x dist/*/savfox/savfox

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: dist/

  build-windows:
    needs: [web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ui-sources

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/download-artifact@v8
        with:
          name: gateway-release-web
          path: crates/gateway-server/static
      - run: node scripts/verify-web-bundle.cjs

      - name: Build Windows x64
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p savfox-cli

      - name: Package Windows binaries
        run: |
          mkdir -p dist/x86_64-pc-windows-msvc/savfox
          cp target/x86_64-pc-windows-msvc/release/savfox.exe dist/x86_64-pc-windows-msvc/savfox/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: dist/

  package-and-publish:
    permissions:
      contents: write
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ui-sources

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-binaries
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: dist/

      - name: Get version
        id: get_version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}
        run: node nodejs/scripts/release-version.cjs >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        run: chmod +x nodejs/scripts/*.sh

      - name: Package npm packages
        run: |
          cd nodejs/scripts
          ./package-npm.sh "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Publish to npm
        run: |
          platforms=$(node -e 'for (const p of require("./nodejs/platforms.json")) console.log(p.platform)')
          for platform in $platforms; do
            npm publish --access public "./npm-packages/savfox-$platform"
          done
          # Do not expose a main version until its exact platform versions resolve.
          for platform in $platforms; do
            ready=false
            for attempt in {1..12}; do
              if [ "$(npm view "@savfox/savfox-$platform@$RELEASE_VERSION" version)" = "$RELEASE_VERSION" ]; then
                ready=true
                break
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "Platform package has not propagated: $platform@$RELEASE_VERSION" >&2
              exit 1
            fi
          done
          npm publish --access public ./npm-packages/savfox
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Create release notes
        if: github.event_name == 'release'
        run: |
          cat > release-notes.md << EOF
          # Savfox $RELEASE_VERSION

          ## Installation

          \`\`\`bash
          npm install -g @savfox/savfox@$RELEASE_VERSION
          \`\`\`

          ## Supported Platforms

          - Linux (x64, ARM64)
          - macOS (x64, Apple Silicon)
          - Windows (x64)

          ## What's Changed

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          EOF

          # Update release with notes
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
