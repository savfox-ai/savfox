name: Build release Web bundle
description: Build and verify the locked Web assets before any native release binary is compiled
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ui-sources
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        key: release-web-wasm
    - name: Install matching wasm-bindgen
      shell: bash
      run: |
        version="$(node -e 'const fs=require("node:fs"); const rows=[...fs.readFileSync("Cargo.lock","utf8").matchAll(/^name = "wasm-bindgen"\r?\nversion = "([^"]+)"$/gm)]; if(rows.length!==1||!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(rows[0][1])) process.exit(1); process.stdout.write(rows[0][1]);')"
        cargo install wasm-bindgen-cli --version "$version" --locked
    - name: Build and validate Web bundle
      shell: bash
      run: |
        node scripts/build-web.cjs --release
        node scripts/verify-web-bundle.cjs
    - uses: actions/upload-artifact@v7
      with:
        name: gateway-release-web
        path: crates/gateway-server/static
        if-no-files-found: error
